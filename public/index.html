<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>U-Like — EV Inventory & Sales</title>
  <meta name="theme-color" content="#14614f">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%2314614f%22/><path d=%22M13 4 6.5 14h4L9.5 20l8-9.5h-4L15 4z%22 fill=%22white%22/></svg>">
  <link rel="stylesheet" href="./css/styles.css?v=2.7">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>

<body>

  <div id="splash" class="app-splash">
    <div class="spinner"></div>
    <strong>Loading U-Like Inventory…</strong>
  </div>

  <!-- Login Screen -->
  <div id="login-view" class="login-view" style="display:none;">
    <div class="login-card">
      <div class="login-header">
        <div class="login-brand-mark">U</div>
        <h2>U-Like</h2>
        <p>EV Inventory &amp; Sales Management</p>
      </div>
      <form id="login-form">
        <div class="form-grid">
          <div class="field field--full">
            <label>Admin Email</label>
            <input type="email" id="login-email" required placeholder="admin@example.com" autocomplete="username">
          </div>
          <div class="field field--full">
            <label>Password</label>
            <div style="position:relative;">
              <input type="password" id="login-password" required placeholder="Enter password" autocomplete="current-password" style="padding-right:38px;">
              <button type="button" class="icon-btn" id="toggle-login-pwd" title="Toggle password visibility" style="position:absolute; right:4px; top:50%; transform:translateY(-50%); width:30px; height:30px;">
                <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="width:16px; height:16px;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div id="login-error" class="form-error" style="display:none; margin-top:12px;"></div>
        <button type="submit" id="login-submit-btn" class="btn btn--primary btn--block" style="margin-top:18px;">
          <span>Sign In</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Authenticated App Shell -->
  <div class="app-shell" id="app-shell" style="display:none;">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__brand-mark">U</div>
        <div class="sidebar__brand-text">
          <strong>U-Like</strong>
          <span>EV Inventory &amp; Sales</span>
        </div>
      </div>
      <nav class="sidebar__nav" id="sidebar-nav"></nav>
      
      <div class="sidebar__user" id="sidebar-user">
        <div class="sidebar__user-email" id="user-email-display">Admin</div>
        <div class="sidebar__user-actions">
          <button class="btn btn--ghost btn--sm" id="change-pwd-btn" title="Change Password">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <span>Password</span>
          </button>
          <button class="btn btn--ghost btn--sm btn--danger-text" id="logout-btn" title="Sign Out">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
            <span>Logout</span>
          </button>
        </div>
      </div>
      <div class="sidebar__footer">5 shops · live sync</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn topbar__menu-btn" id="menu-btn" aria-label="Open menu">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></span>
        </button>
        <div class="topbar__title" id="topbar-title">Dashboard</div>
        <div class="location-switch">
          <select id="location-filter"></select>
        </div>
        <div class="topbar__user" style="display:flex; align-items:center; gap:6px;">
          <button class="btn btn--secondary btn--sm" id="topbar-pwd-btn" title="Change Password">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <span class="hide-sm">Password</span>
          </button>
          <button class="icon-btn icon-btn--danger" id="topbar-logout-btn" title="Sign Out">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
          </button>
        </div>
      </header>
      <main class="view" id="view-root"></main>
    </div>
  </div>

  <script type="module" src="./js/app.js?v=2.8"></script>
</body>

</html>
